[package]
name = "goldfish"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[workspace]
members = ["."]

[dependencies]
ignore = "0.4.23"
nucleo = { path = "vendor/nucleo"}
rusqlite = { version = "0.34" }
crossbeam-channel = "0.5.15"
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
thiserror = "1"
lexopt = "0.3.2"

[dev-dependencies]
tempfile = "3"

[[bin]]
path = "src/main.rs"
name = "gf"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
